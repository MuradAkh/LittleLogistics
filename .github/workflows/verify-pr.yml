name: Verify PR

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify artifact
        run: |
          ./gradlew wrapper
          ./gradlew runData
          ./gradlew build