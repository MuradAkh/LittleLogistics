plugins {
    id 'io.freefair.lombok' version '8.11'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

group = mod_group
base {
    archivesName = lc_mod_id
}
version = "mc${mc_version}-v${lc_mod_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '9999']
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
    }

    client { }
    server { }

    data {
        arguments.addAll '--mod', lc_mod_id, '--all',
                '--existing', file('src/main/resources').absolutePath,
                '--existing', file('src/generated/resources').absolutePath,
                '--existing-mod', 'create',
                '--output', file('src/generated/resources').absolutePath
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Depend on the main Little Logistics mod sources in this same build.
    implementation project(':')

    // Create + its runtime libraries (compile against, not bundled — installed alongside as separate mods).
    compileOnly "maven.modrinth:create:mc${mc_version}-${create_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${mc_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}"

    // Dev runtime: load Little Logistics, Create, and their libs directly.
    runtimeOnly "maven.modrinth:create:mc${mc_version}-${create_version}"
    runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${mc_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}"
}

jar {
    manifest {
        attributes([
            "Specification-Title": lc_mod_id,
            "Specification-Vendor": lc_mod_author,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": lc_mod_version,
            "Implementation-Vendor" : lc_mod_author,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            "mod_id":              project.lc_mod_id,
            "mod_version":         project.lc_mod_version,
            "mod_icon_path":       project.mod_icon_path,
            "mod_title":           project.lc_mod_title,
            "mod_description":     project.lc_mod_description,
            "mod_url":             project.mod_url,
            "mod_author":          project.lc_mod_author,
            "mod_license":         project.lc_mod_license,
            "mc_version_range":    project.mc_version_range,
            "neo_version_range":   project.neo_version_range,
            "version":             project.lc_mod_version
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = lc_mod_id
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///${rootProject.projectDir}/mcmodsrepo"
        }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/MuradAkh/LittleLogistics")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

repositories {
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Jared"
        url 'https://maven.blamejared.com'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "tterrag maven"
        url = "https://maven.tterrag.com"
    }
}
